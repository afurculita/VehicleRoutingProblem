name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Smoke-run all algorithms on a small instance
        run: |
          java -jar target/vrp-*.jar -alg greedy -i datasets/small/P-n16-k8.vrp
          java -jar target/vrp-*.jar -alg tabu   -i datasets/small/P-n16-k8.vrp --seed 1
          java -jar target/vrp-*.jar -alg acs    -i datasets/small/P-n16-k8.vrp --seed 1 --iterations 5
